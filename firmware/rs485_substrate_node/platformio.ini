; Seeed XIAO ESP32-C3 RS485 substrate-node firmware.
;
; Reads a DFRobot SEN0604 substrate sensor over the Seeed RS485 expansion
; board and POSTs Plant A substrate moisture, temperature, EC, and pH to
; dirt-hwd every 30s. Exposes read-only LAN status on :80 and OTA on :3232.
;
; Envs:
;   plant-a-substrate      USB build/upload for initial flash.
;   plant-a-substrate-ota  OTA upload via plant-a-substrate-node.local.

[platformio]
default_envs = plant-a-substrate

[esp32_c3_base]
platform = espressif32
board = seeed_xiao_esp32c3
framework = arduino
monitor_speed = 115200
lib_extra_dirs = ../common
build_flags =
    -D FIRMWARE_VERSION=\"0.1.0-rs485-substrate\"
    -D NODE_SITE_ID=\"homebox\"
    -D NODE_TENT_ID=\"main\"
    -D NODE_ZONE_ID=\"plant-a\"
    -D NODE_DEVICE_ID=\"plant-a-substrate-node\"
    -D NODE_HOSTNAME=\"plant-a-substrate-node\"
    -D MODBUS_ADDRESS=0x02
    -D POST_INTERVAL_MS=30000

[env:plant-a-substrate]
extends = esp32_c3_base
upload_port = /dev/ttyACM0
monitor_port = /dev/ttyACM0

[env:plant-a-substrate-ota]
extends = esp32_c3_base
upload_protocol = espota
upload_port = plant-a-substrate-node.local
upload_flags =
    --auth=${sysenv.PLANT_OTA_PASSWORD}
    --timeout=30
